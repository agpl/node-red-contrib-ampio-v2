<script type="text/html" data-template-name="ampiov2config">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</span></label>
        <input type="text" id="node-config-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <ul style="min-width: 600px; margin-bottom: 20px;" id="node-ampiov2config-server-tabs"></ul>
    </div>
    <div id="node-ampiov2config-server-tabs-content" style="min-height:150px;">
        <div id="ampiov2config-tab-connection" style="display:none">
            <div class="form-row node-input-server">
                <label for="node-config-input-server"><i class="fa fa-globe"></i> Server</label>
                <input type="text" id="node-config-input-server" style="width:40%;" placeholder="e.g. localhost">
                <label for="node-config-input-port" style="margin-left:20px; width:43px; "> Port</label>
                <input type="text" id="node-config-input-port" placeholder="default: 1883" style="width:55px">
            </div>
            <div class="form-tips">
                To connect to the local M-SERV interface, leave the server field empty.<br><br>
                Aby połączyć się z lokalnym interfejsem M-SERV, pozostaw pole serwera puste.
            </div>
            <div class="form-tips" id='warning'>
                <b>Notice:</b> After adding new config or changing settings, <b>Deploy</b> your configuration to see list of devices. Without this step, devices list won't show up.<br><br>
                <b>Uwaga:</b> Dodając nową konfigurację serwera lub zmieniajac aktualną, zrób <b>Deploy</b> projektu, aby zobaczyć listę urządzeń. Do momentu deployowania lista urządzeń nie wczyta się. 
            </div>
            <!--TLS ktorego jeszcze nie ma, planowany w 1.1.0-->
        </div>
        <div id="ampiov2config-tab-security" style="display:none">
            <div class="form-row">
                <label for="node-config-input-user"><i class="fa fa-user"></i> User</span></label>
                <input type="text" id="node-config-input-user">
            </div>
            <div class="form-row">
                <label for="node-config-input-password"><i class="fa fa-lock"></i> Password</span></label>
                <input type="password" id="node-config-input-password">
            </div>
        </div>
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType('ampiov2config',{
        category: 'config',
        defaults: {
            name: {value:""},
            server: {value:""},
            port: {value:1883,required:false,validate:RED.validators.number(true)},
        },
        credentials: {
            user: {type:"text"},
            password: {type: "password"}
        },
        label: function() {
            return this.name||"Ampio v2 Config";
        },
        oneditprepare: function () {
            var tabs = RED.tabs.create({
                id: "node-ampiov2config-server-tabs",
                onchange: function(tab) {
                    $("#node-ampiov2config-server-tabs-content").children().hide();
                    $("#" + tab.id).show();
                }
            });
            tabs.addTab({
                id: "ampiov2config-tab-connection",
                label: "Connection"
            });
            tabs.addTab({
                id: "ampiov2config-tab-security",
                label: "Credentials"
            });
            var node = this;

        },
        oneditsave: function() {
            if (!$("#node-config-input-usetls").is(':checked')) {
                $("#node-config-input-tls").val("");
            }
        }
    });
</script>

<script type="text/x-red" data-help-name="ampiov2config">
    <p>Connection to the MQTT broker of an Ampio server (M-SERV), shared by all Ampio v2 nodes using it.</p>
    <h3>Connection</h3>
    <dl class="message-properties">
        <dt>Server <span class="property-type">string</span></dt>
        <dd>IP address or host name of the Ampio server, ex. <code>192.168.1.10</code>.
            Leave empty when Node-RED runs on the M-SERV itself: the local socket <code>/var/run/ampio/mqtt.sock</code> is used.</dd>
        <dt>Port <span class="property-type">number</span></dt>
        <dd>MQTT port, default <code>1883</code>.</dd>
    </dl>
    <h3>Credentials</h3>
    <dl class="message-properties">
        <dt>User, Password <span class="property-type">string</span></dt>
        <dd>MQTT login of the Ampio server, if the broker requires one.</dd>
    </dl>
    <h3>Details</h3>
    <p>After adding the config or changing it, <b>Deploy</b> before searching for devices in Ampio v2 IN/OUT:
       the device list is loaded through the running config node.</p>
    <p>All nodes share one MQTT connection. Searching for devices opens a short separate connection, so nodes do not receive retained states again.</p>
    <p>Can be used next to the original <code>node-red-contrib-ampio</code> package; both have their own nodes and connections.</p>
</script>
