<script type="text/javascript">
    RED.nodes.registerType('Ampio v2 OUT',{
        category: 'Ampio v2',
        color: '#d4d9db',
        defaults: {
            mac: {value:"", required:true},
            devtype: {value:"", required:true, validate:RED.validators.number()},
            attribute: {value:0, required:true, validate:RED.validators.number()},
            index: {value:0, required:true, validate:RED.validators.number()},
            name: {value:""},
            server: {type:"ampiov2config", required:true}
        },
        inputs:1,
        outputs:0,
        icon: "face.png",
        align: "right",
        label: function() {
            return this.name||"Ampio v2 OUT";
        },
        oneditprepare: function(){
            const node = this;
            let TypeNames = {};
            let Devices = {};

            // fill select with values; saved value is kept selectable only when the device was not discovered
            function fill(id, values, label, saved){
                const sel = $(id).empty();
                const has = saved !== '' && saved !== undefined;
                if(has && !leafs() && values.indexOf(Number(saved)) === -1){
                    values = [Number(saved)].concat(values);
                }
                values.forEach(function(v){
                    $('<option>').val(v).text(label(v)).appendTo(sel);
                });
                if(has && values.indexOf(Number(saved)) !== -1){
                    sel.val(saved);
                }
            }
            function leafs(){
                const dev = Devices[$('#node-input-mac').val()];
                return dev ? dev.leafs : null;
            }
            function range(n){
                return Array.from({length: n}, function(_, i){ return i; });
            }
            function FillTypes(){
                const l = leafs();
                const types = l ? l.map(function(x){ return x.type; }).filter(function(t, i, a){ return a.indexOf(t) === i; })
                                : Object.keys(TypeNames).map(Number);
                fill('#node-input-devtype', types, function(t){ return t + ' - ' + (TypeNames[t] || 'UNKNOWN'); }, node.devtype);
                FillAttributes();
            }
            function FillAttributes(){
                const l = leafs();
                const type = Number($('#node-input-devtype').val());
                const attrs = l ? l.filter(function(x){ return x.type === type; }).map(function(x){ return x.attribute; }) : [0];
                fill('#node-input-attribute', attrs, String, node.attribute);
                FillIndexes();
            }
            function FillIndexes(){
                const l = leafs();
                const type = Number($('#node-input-devtype').val());
                const attr = Number($('#node-input-attribute').val());
                const leaf = l && l.find(function(x){ return x.type === type && x.attribute === attr; });
                const names = leaf ? leaf.names : {};
                fill('#node-input-index', range(leaf ? leaf.count : 32), function(i){
                    return i + (names[i] ? ': ' + names[i] : ' (channel ' + (i + 1) + ')');
                }, node.index);
                FillNamePlaceholder();
            }
            function FillNamePlaceholder(){
                const l = leafs();
                const type = Number($('#node-input-devtype').val());
                const attr = Number($('#node-input-attribute').val());
                const leaf = l && l.find(function(x){ return x.type === type && x.attribute === attr; });
                const desc = leaf && leaf.names[$('#node-input-index').val()];
                $('#node-input-name').attr('placeholder', desc || 'Name');
            }
            function GetDevices(){
                const cfgid = $('#node-input-server').val();
                const sel = $('#node-input-mac').empty();
                $('<option>').val('').text('Searching...').appendTo(sel);
                $.getJSON('ampio-v2/'+cfgid+'/types', function(json){
                    TypeNames = json;
                }).always(function(){
                    $.getJSON('ampio-v2/'+cfgid+'/devices/v1/list')
                    .done(function(data){
                        Devices = {};
                        data.forEach(function(dev){
                            Devices[dev.mac] = dev;
                        });
                    })
                    .fail(function(xhr){
                        RED.notify("Ampio: error loading devices (" + (xhr.responseJSON || xhr.status) + ")", "error");
                    })
                    .always(function(){
                        sel.empty();
                        if(node.mac && !Devices.hasOwnProperty(node.mac)){
                            $('<option>').val(node.mac).text(node.mac + ' (not found)').appendTo(sel);
                        }
                        Object.keys(Devices).forEach(function(mac){
                            const dev = Devices[mac];
                            $('<option>').val(mac).text(mac + (dev.name ? ' (' + dev.name + ')' : '')).appendTo(sel);
                        });
                        if(node.mac){
                            sel.val(node.mac);
                        }
                        FillTypes();
                    });
                });
            }

            GetDevices();
            $("#node-input-lookup-devices").on("click", GetDevices);
            $("#node-input-mac").on('change', FillTypes);
            $("#node-input-devtype").on('change', FillAttributes);
            $("#node-input-attribute").on('change', FillIndexes);
            $("#node-input-index").on('change', FillNamePlaceholder);
        }
    });
</script>

<script type="text/x-red" data-template-name="Ampio v2 OUT">
    <div class="form-row">
        <label for="node-input-server"><i class="icon-tag"></i> Server</label>
        <input type="text" id="node-input-server">
    </div>
    <div class="form-row">
        <label for="node-input-mac"><i class="icon-tag"></i> Target device</label>
        <div style="display: inline-block; position: relative; width: 70%; height: 20px;">
            <div style="position: absolute; left: 0px; right: 40px;">
                <select id="node-input-mac" style="width: 100%;"></select>
            </div>
            <a id="node-input-lookup-devices" class="editor-button" style="position: absolute; right: 0px; top: 0px;">
                <i class="fa fa-search"></i>
            </a>
        </div>
    </div>
    <div class="form-row">
        <label for="node-input-devtype"><i class="icon-tag"></i> Type</label>
        <select id="node-input-devtype" style="width: 70%;"></select>
    </div>
    <div class="form-row">
        <label for="node-input-attribute"><i class="icon-tag"></i> Attribute</label>
        <select id="node-input-attribute" style="width: 70%;"></select>
    </div>
    <div class="form-row">
        <label for="node-input-index"><i class="icon-tag"></i> Index</label>
        <select id="node-input-index" style="width: 70%;"></select>
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="icon-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
</script>

<script type="text/x-red" data-help-name="Ampio v2 OUT">
    <p>Ampio node used to control devices.</p>
    <p>Publishes <code>{"v": msg.payload}</code> to <code>device/v1/set/leaf/&lt;MAC&gt;/&lt;type&gt;/&lt;attribute&gt;/&lt;index&gt;</code>.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>value to set. It is sent as the <code>v</code> field of the JSON message. For RGBW or CCT send an object, ex. <code>{"h":120,"s":100,"v":50}</code> or <code>{"ct":2700,"v":80}</code>.</dd>
        <dt class="optional">mac <span class="property-type">string</span></dt>
        <dd>overrides MAC address of the device selected in node configuration.</dd>
        <dt class="optional">devtype <span class="property-type">number</span></dt>
        <dd>overrides type code (ex. <code>129</code> REL, <code>136</code> BLIND).</dd>
        <dt class="optional">attribute <span class="property-type">number</span></dt>
        <dd>overrides attribute number.</dd>
        <dt class="optional">index <span class="property-type">number</span></dt>
        <dd>overrides channel index, counted from <code>0</code>.</dd>
    </dl>
    <h3>Details</h3>
    <h4>Target device (required)</h4>
    Click the search icon to discover devices. Devices, types and channel descriptions come from the server (<code>get_devices</code> over <code>rpc/v2</code>), attributes from retained states (<code>device/v1/state/leaf/#</code>).
    <h4>Type (required)</h4>
    Type of the value to control. Only types discovered on the selected device are listed.
    <h4>Attribute (required)</h4>
    Usually <code>0</code>. Some types (ex. blinds) expose more attributes.
    <h4>Index (required)</h4>
    Channel number counted from <code>0</code> (ex. relay 1 is index <code>0</code>).
</script>
