<script type="text/javascript">
    RED.nodes.registerType('Ampio v2 OUT',{
        category: 'Ampio v2',
        color: '#d4d9db',
        defaults: {
            mac: {value:"", required:true},
            // device/v1 target: devtype + attribute + index; legacy ampio/ target: valtype + index
            devtype: {value:"", validate:function(v){
                // while the dialog is open check the edited valtype, otherwise the saved one
                const valtype = $('#node-input-valtype').length ? $('#node-input-valtype').val() : this.valtype;
                return !!valtype || RED.validators.number()(v);
            }},
            valtype: {value:""},
            attribute: {value:0, validate:RED.validators.number()},
            index: {value:0, required:true, validate:RED.validators.number()},
            name: {value:""},
            server: {type:"ampiov2config", required:true}
        },
        inputs:1,
        outputs:0,
        icon: "face.png",
        align: "right",
        label: function() {
            return this.name||"Ampio v2 OUT";
        },
        oneditprepare: function(){
            const node = this;
            const ACCESS = 'W'; // 'R' for IN, 'W' for OUT
            let Defs = {};
            let LegacyDefs = {};
            let Devices = {};
            let Order = [];

            function canUse(rw){
                return !!rw && rw.indexOf(ACCESS) !== -1;
            }
            // attributes of a device/v1 type usable in this direction, from Designer definitions
            function defAttrs(type){
                const def = Defs[type];
                if(!def){
                    return [];
                }
                return Object.keys(def.attributes).map(Number).filter(function(a){
                    return canUse(def.attributes[a].rw);
                });
            }
            function attrDef(type, attr){
                return Defs[type] && Defs[type].attributes[attr];
            }
            function unique(list){
                return list.filter(function(x, i, a){ return a.indexOf(x) === i; });
            }
            function device(){
                return Devices[$('#node-input-mac').val()];
            }
            // null = device does not report its leafs (not discovered or legacy), all types are offered
            function leafs(){
                const dev = device();
                return dev && !dev.legacy ? dev.leafs : null;
            }
            function leafOf(type){
                const l = leafs();
                return l && l.find(function(x){ return x.type === type; });
            }
            function legacyOf(valtype){
                const dev = device();
                return dev && (dev.legacyTypes || []).find(function(x){ return x.valtype === valtype; });
            }
            function range(from, n){
                return Array.from({length: n}, function(_, i){ return from + i; });
            }
            // selected type: {legacy: bool, type: Number|String}
            function selected(){
                const v = $('#ampio-type').val() || '';
                return v.indexOf('legacy:') === 0 ? {legacy: true, type: v.slice(7)} : {legacy: false, type: Number(v.slice(3))};
            }
            // fill select with values; saved value stays selectable when the device does not report its channels
            function fill(id, values, label, saved, keepSaved){
                const sel = $(id).empty();
                const has = saved !== '' && saved !== undefined && saved !== null;
                if(has && keepSaved && values.indexOf(Number(saved)) === -1){
                    values = [Number(saved)].concat(values);
                }
                values.forEach(function(v){
                    $('<option>').val(v).text(label(v)).appendTo(sel);
                });
                if(has && values.indexOf(Number(saved)) !== -1){
                    sel.val(saved);
                }
            }
            function FillTypes(){
                const dev = device();
                const l = leafs();
                const sel = $('#ampio-type').empty();
                // device/v1 types, hidden when they have nothing to read (IN) or write (OUT)
                let types = l ? unique(l.map(function(x){ return x.type; })) : (dev && dev.legacy ? [] : Object.keys(Defs).map(Number));
                types = types.filter(function(t){ return !Defs[t] || defAttrs(t).length; });
                // legacy value types: those seen on the device, plus write-only ones that come with them (ex. rm with rs)
                let legacy = dev ? (dev.legacyTypes || []).map(function(x){ return x.valtype; }) : Object.keys(LegacyDefs);
                Object.keys(LegacyDefs).forEach(function(v){
                    if(LegacyDefs[v].with && legacy.indexOf(LegacyDefs[v].with) !== -1 && legacy.indexOf(v) === -1){
                        legacy.push(v);
                    }
                });
                legacy = legacy.filter(function(v){ return !LegacyDefs[v] || canUse(LegacyDefs[v].rw); });
                const saved = node.valtype ? 'legacy:' + node.valtype : (node.devtype !== '' ? 'v1:' + node.devtype : '');
                if(types.length){
                    const g = $('<optgroup>').attr('label', 'device/v1').appendTo(sel);
                    types.forEach(function(t){
                        $('<option>').val('v1:' + t).text(t + ' - ' + (Defs[t] ? Defs[t].label : 'Unknown')).appendTo(g);
                    });
                }
                if(legacy.length){
                    const g = $('<optgroup>').attr('label', 'Legacy (ampio/...)').appendTo(sel);
                    legacy.forEach(function(v){
                        $('<option>').val('legacy:' + v).text(v + ' - ' + (LegacyDefs[v] ? LegacyDefs[v].label : 'Unknown')).appendTo(g);
                    });
                }
                if(saved && !sel.find('option').filter(function(){ return this.value === saved; }).length && !dev){
                    $('<option>').val(saved).text(saved.replace(/^\w+:/, '')).prependTo(sel);
                }
                if(saved && sel.find('option').filter(function(){ return this.value === saved; }).length){
                    sel.val(saved);
                }
                else if(dev && dev.legacy && legacy.length){
                    sel.val('legacy:' + legacy[0]);
                }
                TypeChanged();
            }
            function TypeChanged(){
                const s = selected();
                $('#node-input-valtype').val(s.legacy ? s.type : '');
                $('#node-input-devtype').val(s.legacy ? '' : (isNaN(s.type) ? '' : s.type));
                $('#ampio-attribute-row').toggle(!s.legacy);
                if(s.legacy){
                    $('#node-input-attribute').empty().append($('<option>').val(0).text('0'));
                    FillIndexes();
                    return;
                }
                const l = leafs();
                const seen = l ? l.filter(function(x){ return x.type === s.type; }).map(function(x){ return x.attribute; }) : [];
                let attrs = unique(defAttrs(s.type).concat(Defs[s.type] ? [] : seen));
                if(!attrs.length){
                    attrs = [0];
                }
                attrs.sort(function(a, b){ return a - b; });
                fill('#node-input-attribute', attrs, function(a){
                    const d = attrDef(s.type, a);
                    return a + (d && d.label ? ' - ' + d.label : '') + (d && d.rw ? ' [' + d.rw + ']' : '');
                }, node.attribute, !l);
                FillIndexes();
            }
            function FillIndexes(){
                const s = selected();
                let indexes, names, keep;
                if(s.legacy){
                    const lt = legacyOf(s.type) || legacyOf(LegacyDefs[s.type] && LegacyDefs[s.type].with);
                    indexes = lt ? lt.indexes : range(1, 32);
                    names = lt ? lt.names : {};
                    keep = !lt;
                } else {
                    const leaf = leafOf(s.type);
                    indexes = range(0, leaf ? leaf.count : 32);
                    names = leaf ? leaf.names : {};
                    keep = !leaf;
                }
                fill('#node-input-index', indexes, function(i){
                    return i + (names[i] ? ': ' + names[i] : '');
                }, node.index, keep);
                FillHints();
            }
            function FillHints(){
                const s = selected();
                const index = $('#node-input-index').val();
                let desc, hint = '';
                if(s.legacy){
                    const lt = legacyOf(s.type) || legacyOf(LegacyDefs[s.type] && LegacyDefs[s.type].with);
                    desc = lt && lt.names[index];
                    hint = LegacyDefs[s.type] && LegacyDefs[s.type].hint || '';
                } else {
                    const d = attrDef(s.type, Number($('#node-input-attribute').val()));
                    const leaf = leafOf(s.type);
                    desc = leaf && leaf.names[index];
                    if(d){
                        if(d.enum){
                            hint = Object.keys(d.enum).map(function(k){ return k + ' = ' + d.enum[k]; }).join(', ');
                        } else if(d.fields){
                            hint = 'object {' + d.fields.join(', ') + '}';
                        } else if(d.kind === 'binary'){
                            hint = '0 / 1 (true / false)';
                        } else if(d.min !== undefined){
                            hint = d.min + ' .. ' + d.max + (d.unit ? ' ' + d.unit : '');
                        } else {
                            hint = d.kind;
                        }
                    }
                }
                $('#node-input-name').attr('placeholder', desc || 'Name');
                $('#ampio-value-hint').text(hint ? 'Value: ' + hint : '').toggle(!!hint);
                $('#ampio-legacy-hint').toggle(s.legacy);
            }
            function GetDevices(){
                const cfgid = $('#node-input-server').val();
                const sel = $('#node-input-mac').empty();
                $('<option>').val('').text('Searching...').appendTo(sel);
                $.getJSON('ampio-v2/'+cfgid+'/leafdefs', function(json){
                    Defs = json;
                }).always(function(){
                    $.getJSON('ampio-v2/'+cfgid+'/legacydefs', function(json){
                        LegacyDefs = json;
                    }).always(function(){
                        $.getJSON('ampio-v2/'+cfgid+'/devices/v1/list')
                        .done(function(data){
                            Devices = {};
                            Order = [];
                            data.forEach(function(dev){
                                Devices[dev.mac] = dev;
                                Order.push(dev.mac);
                            });
                        })
                        .fail(function(xhr){
                            RED.notify("Ampio: error loading devices (" + (xhr.responseJSON || xhr.status) + ")", "error");
                        })
                        .always(function(){
                            sel.empty();
                            if(node.mac && !Devices.hasOwnProperty(node.mac)){
                                $('<option>').val(node.mac).text(node.mac + ' (not found)').appendTo(sel);
                            }
                            // Order keeps server order, object keys would put numeric-looking MACs first
                            Order.forEach(function(mac){
                                const dev = Devices[mac];
                                $('<option>').val(mac).text(mac + (dev.name ? ' (' + dev.name + ')' : '') + (dev.legacy ? ' - legacy' : '')).appendTo(sel);
                            });
                            if(node.mac){
                                sel.val(node.mac);
                            }
                            FillTypes();
                        });
                    });
                });
            }

            GetDevices();
            $("#node-input-lookup-devices").on("click", GetDevices);
            $("#node-input-mac").on('change', FillTypes);
            $("#ampio-type").on('change', TypeChanged);
            $("#node-input-attribute").on('change', FillHints);
            $("#node-input-index").on('change', FillHints);
        }
    });
</script>

<script type="text/x-red" data-template-name="Ampio v2 OUT">
    <div class="form-row">
        <label for="node-input-server"><i class="icon-tag"></i> Server</label>
        <input type="text" id="node-input-server">
    </div>
    <div class="form-row">
        <label for="node-input-mac"><i class="icon-tag"></i> Target device</label>
        <div style="display: inline-block; position: relative; width: 70%; height: 20px;">
            <div style="position: absolute; left: 0px; right: 40px;">
                <select id="node-input-mac" style="width: 100%;"></select>
            </div>
            <a id="node-input-lookup-devices" class="editor-button" style="position: absolute; right: 0px; top: 0px;">
                <i class="fa fa-search"></i>
            </a>
        </div>
    </div>
    <div class="form-row">
        <label for="ampio-type"><i class="icon-tag"></i> Type</label>
        <select id="ampio-type" style="width: 70%;"></select>
        <input type="hidden" id="node-input-devtype">
        <input type="hidden" id="node-input-valtype">
    </div>
    <div class="form-row" id="ampio-attribute-row">
        <label for="node-input-attribute"><i class="icon-tag"></i> Attribute</label>
        <select id="node-input-attribute" style="width: 70%;"></select>
    </div>
    <div class="form-tips" id="ampio-value-hint" style="display: none;"></div>
    <div class="form-tips" id="ampio-legacy-hint" style="display: none;"><b>Legacy API:</b> uses <code>ampio/from|to/&lt;MAC&gt;/...</code> topics with plain values, for older CAN devices.</div>
    <div class="form-row">
        <label for="node-input-index"><i class="icon-tag"></i> Index</label>
        <select id="node-input-index" style="width: 70%;"></select>
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="icon-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
</script>

<script type="text/x-red" data-help-name="Ampio v2 OUT">
    <p>Ampio node used to control devices.</p>
    <p>Publishes <code>{"v": msg.payload}</code> to <code>device/v1/set/leaf/&lt;MAC&gt;/&lt;type&gt;/&lt;attribute&gt;/&lt;index&gt;</code>.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>value to set. It is sent as the <code>v</code> field of the JSON message, <code>true</code>/<code>false</code> are sent as <code>1</code>/<code>0</code>. For RGBW or CCT send an object, ex. <code>{"h":120,"s":100,"v":50}</code> or <code>{"ct":2700,"v":80}</code>.</dd>
        <dt class="optional">time <span class="property-type">number</span></dt>
        <dd>optional time sent along with the value (<code>{"v": ..., "time": ...}</code>), as Ampio Designer does.</dd>
        <dt class="optional">mac <span class="property-type">string</span></dt>
        <dd>overrides MAC address of the device selected in node configuration.</dd>
        <dt class="optional">devtype <span class="property-type">number</span></dt>
        <dd>overrides type code (ex. <code>129</code> REL, <code>136</code> BLIND).</dd>
        <dt class="optional">attribute <span class="property-type">number</span></dt>
        <dd>overrides attribute number.</dd>
        <dt class="optional">valtype <span class="property-type">string</span></dt>
        <dd>sends to the legacy API with this value type (ex. <code>f</code>, <code>o</code>, <code>rs</code>), payload is sent as a plain string. <code>msg.devtype</code> without <code>msg.valtype</code> sends to device/v1.</dd>
        <dt class="optional">index <span class="property-type">number</span></dt>
        <dd>overrides channel index, counted from <code>0</code>.</dd>
    </dl>
    <h3>Details</h3>
    <h4>Target device (required)</h4>
    Click the search icon to discover devices. Devices, types and channel descriptions come from the server (<code>get_devices</code> over <code>rpc/v2</code>), attributes from retained states (<code>device/v1/state/leaf/#</code>).
    Older CAN devices which are not available on <code>device/v1</code> are listed with <code>- legacy</code> and use the legacy API.
    <h4>Legacy types</h4>
    The <i>Legacy (ampio/...)</i> group of the Type field lists value types of the legacy API seen on the device (ex. <code>f</code> flags, <code>i</code> inputs, <code>o</code> outputs, <code>t</code> temperatures, <code>au16l</code> M-SENS sensors).
    They use <code>ampio/from/&lt;MAC&gt;/state/&lt;type&gt;/&lt;index&gt;</code> and <code>ampio/to/&lt;MAC&gt;/&lt;type&gt;/&lt;index&gt;/cmd</code> with plain values; indexes count from <code>1</code>.
    <h4>Type (required)</h4>
    Type of the value to control. Only types discovered on the selected device are listed. Types with nothing to write are hidden.
    <h4>Attribute (required)</h4>
    All writable attributes of the type are listed (<code>[W]</code> write only, <code>[RW]</code> read/write), ex. blind position, slat position, motor command. Expected value (range, enum values or object fields) is shown below the field.
    <h4>Index (required)</h4>
    Channel number counted from <code>0</code> (ex. relay 1 is index <code>0</code>).
</script>
