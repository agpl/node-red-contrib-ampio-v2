<script type="text/javascript">
    RED.nodes.registerType('Ampio v2 OUT',{
        category: 'Ampio v2',
        color: '#d4d9db',
        defaults: {
            mac: {value:"", required:true},
            // device/v1 target: devtype + attribute + index; legacy ampio/ target: valtype + index
            devtype: {value:"", validate:function(v){
                // while the dialog is open check the edited valtype, otherwise the saved one
                const valtype = $('#node-input-valtype').length ? $('#node-input-valtype').val() : this.valtype;
                return !!valtype || RED.validators.number()(v);
            }},
            valtype: {value:""},
            attribute: {value:0, validate:RED.validators.number()},
            index: {value:0, required:true, validate:RED.validators.number()},
            name: {value:""},
            server: {type:"ampiov2config", required:true}
        },
        inputs:1,
        outputs:0,
        icon: "face.png",
        align: "right",
        label: function() {
            return this.name||"Ampio v2 OUT";
        },
        oneditprepare: function(){
            const node = this;
            const ACCESS = 'W'; // 'R' for IN, 'W' for OUT
            let Defs = {};
            let LegacyDefs = {};
            let Devices = {};
            let Order = [];

            function canUse(rw){
                return !!rw && rw.indexOf(ACCESS) !== -1;
            }
            // attributes of a device/v1 type usable in this direction, from Designer definitions
            function defAttrs(type){
                const def = Defs[type];
                if(!def){
                    return [];
                }
                return Object.keys(def.attributes).map(Number).filter(function(a){
                    return canUse(def.attributes[a].rw);
                });
            }
            function attrDef(type, attr){
                return Defs[type] && Defs[type].attributes[attr];
            }
            function unique(list){
                return list.filter(function(x, i, a){ return a.indexOf(x) === i; });
            }
            function device(){
                return Devices[$('#node-input-mac').val()];
            }
            // null = device does not report its leafs (not discovered or legacy), all types are offered
            function leafs(){
                const dev = device();
                return dev && !dev.legacy ? dev.leafs : null;
            }
            function leafOf(type){
                const l = leafs();
                return l && l.find(function(x){ return x.type === type; });
            }
            function legacyOf(valtype){
                const dev = device();
                return dev && (dev.legacyTypes || []).find(function(x){ return x.valtype === valtype; });
            }
            function range(from, n){
                return Array.from({length: n}, function(_, i){ return from + i; });
            }
            // selected type: {legacy: bool, type: Number|String}
            function selected(){
                const v = $('#ampio-type').val() || '';
                return v.indexOf('legacy:') === 0 ? {legacy: true, type: v.slice(7)} : {legacy: false, type: Number(v.slice(3))};
            }
            // fill select with values; saved value stays selectable when the device does not report its channels
            function fill(id, values, label, saved, keepSaved){
                const sel = $(id).empty();
                const has = saved !== '' && saved !== undefined && saved !== null;
                if(has && keepSaved && values.indexOf(Number(saved)) === -1){
                    values = [Number(saved)].concat(values);
                }
                values.forEach(function(v){
                    $('<option>').val(v).text(label(v)).appendTo(sel);
                });
                if(has && values.indexOf(Number(saved)) !== -1){
                    sel.val(saved);
                }
            }
            function FillTypes(){
                const dev = device();
                const l = leafs();
                const sel = $('#ampio-type').empty();
                // device/v1 types, hidden when they have nothing to read (IN) or write (OUT)
                let types = l ? unique(l.map(function(x){ return x.type; })) : (dev && dev.legacy ? [] : Object.keys(Defs).map(Number));
                types = types.filter(function(t){ return !Defs[t] || defAttrs(t).length; });
                // legacy value types: those seen on the device, write-only ones that come with them (ex. rm with rs)
                // and those available on every device (raw CAN frame)
                let legacy = dev ? (dev.legacyTypes || []).map(function(x){ return x.valtype; }) : Object.keys(LegacyDefs);
                Object.keys(LegacyDefs).forEach(function(v){
                    const d = LegacyDefs[v];
                    if((d.always || (d.with && legacy.indexOf(d.with) !== -1)) && legacy.indexOf(v) === -1){
                        legacy.push(v);
                    }
                });
                legacy = legacy.filter(function(v){ return !LegacyDefs[v] || canUse(LegacyDefs[v].rw); });
                const saved = node.valtype ? 'legacy:' + node.valtype : (node.devtype !== '' ? 'v1:' + node.devtype : '');
                if(types.length){
                    const g = $('<optgroup>').attr('label', 'device/v1').appendTo(sel);
                    types.forEach(function(t){
                        $('<option>').val('v1:' + t).text(t + ' - ' + (Defs[t] ? Defs[t].label : 'Unknown')).appendTo(g);
                    });
                }
                if(legacy.length){
                    const g = $('<optgroup>').attr('label', 'Legacy (ampio/...)').appendTo(sel);
                    legacy.forEach(function(v){
                        $('<option>').val('legacy:' + v).text(v + ' - ' + (LegacyDefs[v] ? LegacyDefs[v].label : 'Unknown')).appendTo(g);
                    });
                }
                if(saved && !sel.find('option').filter(function(){ return this.value === saved; }).length && !dev){
                    $('<option>').val(saved).text(saved.replace(/^\w+:/, '')).prependTo(sel);
                }
                if(saved && sel.find('option').filter(function(){ return this.value === saved; }).length){
                    sel.val(saved);
                }
                else if(dev && dev.legacy && legacy.length){
                    sel.val('legacy:' + legacy[0]);
                }
                TypeChanged();
            }
            function TypeChanged(){
                const s = selected();
                $('#node-input-valtype').val(s.legacy ? s.type : '');
                $('#node-input-devtype').val(s.legacy ? '' : (isNaN(s.type) ? '' : s.type));
                $('#ampio-attribute-row').toggle(!s.legacy);
                $('#ampio-index-row').toggle(!(s.legacy && LegacyDefs[s.type] && LegacyDefs[s.type].noIndex));
                if(s.legacy){
                    $('#node-input-attribute').empty().append($('<option>').val(0).text('0'));
                    FillIndexes();
                    return;
                }
                const l = leafs();
                const seen = l ? l.filter(function(x){ return x.type === s.type; }).map(function(x){ return x.attribute; }) : [];
                let attrs = unique(defAttrs(s.type).concat(Defs[s.type] ? [] : seen));
                if(!attrs.length){
                    attrs = [0];
                }
                attrs.sort(function(a, b){ return a - b; });
                fill('#node-input-attribute', attrs, function(a){
                    const d = attrDef(s.type, a);
                    return a + (d && d.label ? ' - ' + d.label : '') + (d && d.rw ? ' [' + d.rw + ']' : '');
                }, node.attribute, !l);
                FillIndexes();
            }
            function FillIndexes(){
                const s = selected();
                let indexes, names, keep;
                if(s.legacy){
                    const lt = legacyOf(s.type) || legacyOf(LegacyDefs[s.type] && LegacyDefs[s.type].with);
                    indexes = lt ? lt.indexes : range(1, 32);
                    names = lt ? lt.names : {};
                    keep = !lt;
                } else {
                    const leaf = leafOf(s.type);
                    indexes = range(0, leaf ? leaf.count : 32);
                    names = leaf ? leaf.names : {};
                    keep = !leaf;
                }
                fill('#node-input-index', indexes, function(i){
                    return i + (names[i] ? ': ' + names[i] : '');
                }, node.index, keep);
                FillHints();
            }
            // topic this node will use, same rules as generic/ampio-utils.js
            function topicFor(s, mac, attr, index){
                if(!mac || s.type === '' || (!s.legacy && isNaN(s.type))){
                    return '';
                }
                if(s.legacy && s.type === 'raw'){
                    return 'ampio/to/' + mac.toLowerCase() + '/raw';
                }
                if(s.legacy){
                    const set = LegacyDefs[s.type] && LegacyDefs[s.type].set || s.type;
                    return ACCESS === 'R'
                        ? 'ampio/from/' + mac.toUpperCase() + '/state/' + s.type + '/' + index
                        : 'ampio/to/' + mac.toUpperCase() + '/' + set + '/' + index + '/cmd';
                }
                return 'device/v1/' + (ACCESS === 'R' ? 'state' : 'set') + '/leaf/' + mac + '/' + s.type + '/' + attr + '/' + index;
            }
            function FillHints(){
                const s = selected();
                const mac = $('#node-input-mac').val();
                const attr = Number($('#node-input-attribute').val()) || 0;
                const index = $('#node-input-index').val();
                const raw = s.legacy && s.type === 'raw';
                let desc, hint = '';
                if(s.legacy){
                    const lt = legacyOf(s.type) || legacyOf(LegacyDefs[s.type] && LegacyDefs[s.type].with);
                    desc = lt && lt.names[index];
                    hint = LegacyDefs[s.type] && LegacyDefs[s.type].hint || '';
                } else {
                    const d = attrDef(s.type, attr);
                    const leaf = leafOf(s.type);
                    desc = leaf && leaf.names[index];
                    if(d){
                        if(d.enum){
                            hint = Object.keys(d.enum).map(function(k){ return k + ' = ' + d.enum[k]; }).join(', ');
                        } else if(d.fields){
                            hint = 'object {' + d.fields.join(', ') + '}';
                        } else if(d.kind === 'binary'){
                            hint = '0 / 1 (true / false)';
                        } else if(d.min !== undefined){
                            hint = d.min + ' .. ' + d.max + (d.unit ? ' ' + d.unit : '');
                        } else {
                            hint = d.kind;
                        }
                    }
                }
                $('#node-input-name').attr('placeholder', desc || 'Name');
                const info = $('#ampio-info').empty();
                function line(label, text, code){
                    const row = $('<div>').appendTo(info);
                    $('<b>').text(label + ': ').appendTo(row);
                    (code ? $('<code>') : $('<span>')).text(text).appendTo(row);
                }
                if(hint){
                    line(ACCESS === 'R' ? 'Value' : 'Send', hint);
                }
                if(!raw){
                    line('Index', s.legacy ? 'counted from 1 (legacy API)' : 'counted from 0, channel 1 = index 0');
                }
                const topic = topicFor(s, mac, attr, index);
                if(topic){
                    line('Topic', topic, true);
                }
                if(s.legacy){
                    line('Legacy API', raw
                        ? 'payload is sent as hex bytes, ex. "0901"; frames are described in Ampio CAN documentation'
                        : (ACCESS === 'R' ? 'older CAN devices, plain text values; numeric ones are output as numbers' : 'older CAN devices, the payload is sent as plain text'));
                }
                info.toggle(info.children().length > 0);
            }
            function GetDevices(){
                const cfgid = $('#node-input-server').val();
                const sel = $('#node-input-mac').empty();
                $('<option>').val('').text('Searching...').appendTo(sel);
                $.getJSON('ampio-v2/'+cfgid+'/leafdefs', function(json){
                    Defs = json;
                }).always(function(){
                    $.getJSON('ampio-v2/'+cfgid+'/legacydefs', function(json){
                        LegacyDefs = json;
                    }).always(function(){
                        $.getJSON('ampio-v2/'+cfgid+'/devices/v1/list')
                        .done(function(data){
                            Devices = {};
                            Order = [];
                            data.forEach(function(dev){
                                Devices[dev.mac] = dev;
                                Order.push(dev.mac);
                            });
                        })
                        .fail(function(xhr){
                            RED.notify("Ampio: error loading devices (" + (xhr.responseJSON || xhr.status) + ")", "error");
                        })
                        .always(function(){
                            sel.empty();
                            if(node.mac && !Devices.hasOwnProperty(node.mac)){
                                $('<option>').val(node.mac).text(node.mac + ' (not found)').appendTo(sel);
                            }
                            // Order keeps server order, object keys would put numeric-looking MACs first
                            Order.forEach(function(mac){
                                const dev = Devices[mac];
                                $('<option>').val(mac).text(mac + (dev.name ? ' (' + dev.name + ')' : '') + (dev.legacy ? ' - legacy' : '')).appendTo(sel);
                            });
                            if(node.mac){
                                sel.val(node.mac);
                            }
                            FillTypes();
                        });
                    });
                });
            }

            GetDevices();
            $("#node-input-lookup-devices").on("click", GetDevices);
            $("#node-input-mac").on('change', FillTypes);
            $("#ampio-type").on('change', TypeChanged);
            $("#node-input-attribute").on('change', FillHints);
            $("#node-input-index").on('change', FillHints);
        }
    });
</script>

<script type="text/x-red" data-template-name="Ampio v2 OUT">
    <div class="form-row">
        <label for="node-input-server"><i class="icon-tag"></i> Server</label>
        <input type="text" id="node-input-server">
    </div>
    <div class="form-row">
        <label for="node-input-mac"><i class="icon-tag"></i> Target device</label>
        <div style="display: inline-block; position: relative; width: 70%; height: 20px;">
            <div style="position: absolute; left: 0px; right: 40px;">
                <select id="node-input-mac" style="width: 100%;"></select>
            </div>
            <a id="node-input-lookup-devices" class="editor-button" style="position: absolute; right: 0px; top: 0px;">
                <i class="fa fa-search"></i>
            </a>
        </div>
    </div>
    <div class="form-tips" style="margin-bottom: 12px;">
        Click <i class="fa fa-search"></i> to load devices from the server. A new or changed server config has to be <b>deployed</b> first.
        Devices marked <i>legacy</i> are older CAN modules available only through the legacy API.
    </div>
    <div class="form-row">
        <label for="ampio-type"><i class="icon-tag"></i> Type</label>
        <select id="ampio-type" style="width: 70%;"></select>
        <input type="hidden" id="node-input-devtype">
        <input type="hidden" id="node-input-valtype">
    </div>
    <div class="form-row" id="ampio-attribute-row">
        <label for="node-input-attribute"><i class="icon-tag"></i> Attribute</label>
        <select id="node-input-attribute" style="width: 70%;"></select>
    </div>
    <div class="form-row" id="ampio-index-row">
        <label for="node-input-index"><i class="icon-tag"></i> Index</label>
        <select id="node-input-index" style="width: 70%;"></select>
    </div>
    <div class="form-tips" id="ampio-info" style="display: none; margin-bottom: 12px;"></div>
    <div class="form-row">
        <label for="node-input-name"><i class="icon-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
</script>

<script type="text/x-red" data-help-name="Ampio v2 OUT">
    <p>Controls an Ampio device channel: relays, dimmers, blinds, flags, colours, HVAC, heating zones and more. Can also send raw CAN frames.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">number | boolean | string | object</span></dt>
        <dd>value to set. <code>true</code>/<code>false</code> are sent as <code>1</code>/<code>0</code>.
            Colour channels take an object, ex. RGBW <code>{"h":120,"s":100,"v":50}</code>, CCT <code>{"ct":2700,"v":80}</code>.
            For legacy types the value is sent as text, for <code>raw</code> as hex bytes.</dd>
        <dt class="optional">time <span class="property-type">number</span></dt>
        <dd>device/v1 only: sent along with the value as <code>{"v": ..., "time": ...}</code>, as Ampio Designer does.</dd>
        <dt class="optional">mac <span class="property-type">string</span></dt>
        <dd>controls another device than the one configured, ex. <code>"1f242"</code>.</dd>
        <dt class="optional">index <span class="property-type">number</span></dt>
        <dd>controls another channel (device/v1 from <code>0</code>, legacy from <code>1</code>).</dd>
        <dt class="optional">devtype <span class="property-type">number</span></dt>
        <dd>device/v1 type code, ex. <code>129</code> relay. Sends to device/v1 even if the node is set to a legacy type.</dd>
        <dt class="optional">attribute <span class="property-type">number</span></dt>
        <dd>device/v1 attribute, ex. blind <code>2</code> motor.</dd>
        <dt class="optional">valtype <span class="property-type">string</span></dt>
        <dd>legacy value type, ex. <code>"f"</code>, <code>"o"</code>, <code>"rs"</code>, or <code>"raw"</code> for a raw CAN frame. Sends to the legacy API.</dd>
    </dl>

    <h3>Details</h3>
    <p>Pick the server, click <i class="fa fa-search"></i> and choose the device, type, attribute and channel.
       The box below the fields shows what value to send and the exact MQTT topic the node publishes to.</p>
    <h4>Server</h4>
    <p>Ampio v2 Config node with the MQTT broker of the Ampio server. Deploy a new or changed config before searching for devices.</p>
    <h4>Target device</h4>
    <p>Devices found on the server, with names from Ampio Designer. Older CAN modules are marked <i>legacy</i> and are controlled through the legacy API.</p>
    <h4>Type</h4>
    <p>The <i>device/v1</i> group lists channel types the device has; types with nothing to write are hidden.
       The <i>Legacy (ampio/...)</i> group lists legacy value types:</p>
    <ul>
        <li><code>o</code> outputs: <code>0</code>/<code>1</code>, <code>ON</code>/<code>OFF</code>, or <code>0</code>..<code>255</code> for analog outputs; <code>a</code> analog outputs <code>0</code>..<code>255</code></li>
        <li><code>f</code> flags <code>0</code>/<code>1</code></li>
        <li><code>rs</code> zone set temperature, ex. <code>19</code>; <code>rsdn</code> day/night temperatures, ex. <code>19,20</code>;
            <code>rm</code> zone mode: <code>0</code> calendar, <code>1</code> manual, <code>2</code> manual 2, <code>3</code> holiday, <code>4</code> lock</li>
        <li><code>raw</code> raw CAN frame as hex, ex. <code>"0901"</code>, sent to <code>ampio/to/&lt;mac&gt;/raw</code>. For advanced users, see Ampio CAN documentation.</li>
    </ul>
    <h4>Attribute</h4>
    <p>Part of the channel to set, device/v1 only, ex. blind <code>0</code> position <code>0</code>..<code>100</code>,
       <code>1</code> slat position, <code>2</code> motor (<code>0</code> stop, <code>1</code> close, <code>2</code> open).
       <code>[W]</code> write only, <code>[RW]</code> read and write.</p>
    <h4>Index</h4>
    <p>Channel of the device, with its description from Designer if set. device/v1 counts from <code>0</code> (relay 1 = index 0), legacy counts from <code>1</code>.</p>

    <h3>Examples</h3>
    <p>Turn on relay 1 of <code>1f242</code>: type <code>129 - Relay</code>, attribute <code>0</code>, index <code>0</code>, <code>payload: true</code>
       → <code>device/v1/set/leaf/1f242/129/0/0</code> <code>{"v":1}</code>.</p>
    <p>Open blind 3: type <code>136 - Blind</code>, attribute <code>2 - Motor</code>, index <code>2</code>, <code>payload: 2</code>.</p>
    <p>Set flag 5 of the server <code>15d6c</code>: type <code>f - Flag</code>, index <code>5</code>, <code>payload: 1</code>
       → <code>ampio/to/15D6C/f/5/cmd</code> <code>1</code>.</p>
</script>
