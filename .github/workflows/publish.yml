name: Publish to npm

# Push a version tag to publish, ex.:
#   npm version minor && git push --follow-tags
#
# Uses npm trusted publishing (OIDC), no npm token is stored in GitHub.
# npmjs.com -> package settings -> Trusted publisher -> GitHub Actions:
#   organization/user: agpl, repository: node-red-contrib-ampio-v2,
#   workflow filename: publish.yml, environment: npm
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: npm with trusted publishing support (11.5.1 or newer)
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Tag matches package.json version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
      # provenance is added automatically when publishing through a trusted publisher
      - name: Publish
        run: npm publish --access public
