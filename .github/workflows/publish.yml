name: Publish to npm

# Push a version tag to publish, ex.:
#   npm version minor && git push --follow-tags
#
# Uses npm trusted publishing (OIDC), no npm token is stored in GitHub.
# npmjs.com -> package settings -> Trusted publisher -> GitHub Actions:
#   organization/user: agpl, repository: node-red-contrib-ampio-v2,
#   workflow filename: publish.yml, environment: npm
#
# The version is staged, not published: approve it with 2FA to make it public:
#   npm stage list node-red-contrib-ampio-v2
#   npm stage approve <stage-id>
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: ci
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: npm with trusted and staged publishing support
        run: npm install -g npm@^11.21.0
      - run: npm ci
      - name: Tag matches package.json version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
      # provenance is added automatically when publishing through a trusted publisher
      - name: Stage for publishing (approve with 2FA to release)
        run: npm stage publish . --access public
